plugins {
	id 'org.springframework.boot' version '4.1.2'
	id 'com.palantir.git-version' version '5.1.0'
}

version = gitVersion()

apply plugin: 'java'
apply plugin: 'checkstyle'

group = 'com.bannergress'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
}

repositories {
  maven {
    url = 'https://repo.osgeo.org/repository/geotools-releases/'
  }
	mavenCentral()
}

dependencies {
  implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
  implementation 'org.springframework.boot:spring-boot-starter-restclient'
  implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.hibernate.orm:hibernate-envers'
  implementation 'org.hibernate.orm:hibernate-spatial'
  implementation platform('org.hibernate.search:hibernate-search-platform-bom:8.4.1.Final')
  implementation 'org.hibernate.search:hibernate-search-mapper-orm'
  implementation 'org.hibernate.search:hibernate-search-backend-lucene'
	implementation 'com.google.guava:guava:33.8.0-jre'
	implementation 'com.google.maps:google-maps-services:2.0.0'
  implementation 'com.squareup.okhttp3:okhttp:5.5.1'
  implementation 'tools.jackson.dataformat:jackson-dataformat-xml'
  implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'
  implementation 'org.geotools:gt-referencing:34.3'

  annotationProcessor platform('org.springframework.boot:spring-boot-dependencies:4.1.2')
  annotationProcessor 'org.hibernate.orm:hibernate-processor'
  annotationProcessor 'net.karneim:pojobuilder:4.3.1'

  compileOnly 'net.karneim:pojobuilder:4.3.1:annotations'

	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
  runtimeOnly 'org.apache.lucene:lucene-backward-codecs'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
}

checkstyle {
	configFile = file('config/checkstyle/simple-checkstyle.xml')
	sourceSets = [project.sourceSets.main, project.sourceSets.test]
	maxErrors = 0
	maxWarnings = 0
}

test {
	useJUnitPlatform()
}

bootRun {
	if (project.hasProperty('jvmArgs')) {
		jvmArgs = (project.jvmArgs.split('\\s+') as List)
	}
}

tasks.named("bootBuildImage") {
	imageName.set("ghcr.io/bannergress/${project.name}:${project.version}")
}
