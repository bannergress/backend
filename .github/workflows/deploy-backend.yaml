name: Deploy backend environment

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: backend-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Reject superseded main releases
        run: |
          current=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [[ "$DEPLOY_TARGET" == test ]]; then
            test "$current" = "$GITHUB_SHA"
          else
            # Production is permitted only by a published stable Release on a main-reachable tag.
            test "$GITHUB_EVENT_NAME" = release
            git merge-base --is-ancestor HEAD origin/main
            python3 - <<'PYRELEASE'
          import json
          import os
          with open(os.environ['GITHUB_EVENT_PATH']) as stream:
              release = json.load(stream)['release']
          assert not release['draft'] and not release['prerelease']
          PYRELEASE
          fi
        env:
          DEPLOY_TARGET: ${{ inputs.environment }}
      - name: Deploy pinned image and verify readiness
        run: python3 scripts/run-backend-deploy.py
        env:
          DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
          DEPLOY_IMAGE: ${{ inputs.image }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
