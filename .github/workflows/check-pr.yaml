name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Tests, Checkstyle and JAR (Java 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: comments_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d comments_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      COMMENTS_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/comments_test
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release source
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify delivery boundaries
        run: |
          bash -n scripts/deploy-backend.sh scripts/backend-deploy-command.sh
          python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test, lint and package
        run: ./gradlew test checkstyleMain checkstyleTest bootJar --no-daemon
      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests/
            build/reports/checkstyle/
            build/test-results/
      - name: Upload executable JAR
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 7

  image:
    name: Publish immutable backend image
    needs: verify
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.digest.outputs.image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate release source
        if: github.event_name == 'release'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image with the existing Spring Boot buildpack tooling
        env:
          IMAGE_TAG: ghcr.io/bannergress/bannergress-backend:sha-${{ github.sha }}
        run: ./gradlew bootBuildImage --imageName="$IMAGE_TAG" --no-daemon
      - name: Publish and record digest
        id: digest
        env:
          IMAGE_TAG: ghcr.io/bannergress/bannergress-backend:sha-${{ github.sha }}
        run: |
          docker push "$IMAGE_TAG"
          image=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
          [[ "$image" =~ ^ghcr\.io/bannergress/bannergress-backend@sha256:[0-9a-f]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy_test:
    name: Deploy test
    needs: image
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy-backend.yaml
    with:
      environment: test
      image: ${{ needs.image.outputs.image }}
    secrets: inherit

  deploy_production:
    name: Deploy production
    needs: image
    if: github.event_name == 'release' && !github.event.release.prerelease
    uses: ./.github/workflows/deploy-backend.yaml
    with:
      environment: production
      image: ${{ needs.image.outputs.image }}
    secrets: inherit
