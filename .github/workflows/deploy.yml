name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Get version from git
        id: describe
        run: echo "version=`git describe --tags`" >> $GITHUB_OUTPUT
      - name: Install ssh files
        run: |
          echo "$SSH_PRIVATE_KEY" > keyfile
          chmod go-rw keyfile
          echo "$SSH_KNOWN_HOSTS" > known_hosts_file
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      - name: Deploy
        run: ssh -P ${{ secrets.SSH_PORT }} -r -i keyfile -o UserKnownHostsFile=known_hosts_file 'cd ${{ secrets.SSH_TARGET }} && sed -i '"'"'s/\(ghcr.io\/bannergress\/bannergress-backend:\).*/\$ {{ steps.describe.outputs.version }}/'"'"' compose.yaml && docker compose up'
