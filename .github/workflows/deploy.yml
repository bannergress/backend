name: Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: environment
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get version from git
        id: describe
        run: echo "version=`git describe --tags`" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and publish image
        run: ./gradlew bootBuildImage --imageName=ghcr.io/bannergress/bannergress-backend:${{ steps.describe.outputs.version }} --publishImage

      - name: Install ssh files
        run: |
          echo "$SSH_PRIVATE_KEY" > keyfile
          chmod go-rw keyfile
          echo "$SSH_KNOWN_HOSTS" > known_hosts_file
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}

      - name: Deploy
        run: ssh -p ${{ secrets.SSH_PORT }} -l ${{ secrets.SSH_USER }} -i keyfile -o UserKnownHostsFile=known_hosts_file ${{ secrets.SSH_HOST }} 'cd ${{ secrets.SSH_TARGET }} && sed -i '"'"'s/\(ghcr.io\/bannergress\/bannergress-backend:\).*/\1${{ steps.describe.outputs.version }}/'"'"' compose.yaml && docker compose up --detach'
